name: ci

# The merge gate for the clinician portal: lint, type-checked build, unit tests.
# Runs on every PR and on every push to the three long-lived branches. It does
# NOT deploy anything — deploy-staging.yml owns staging, and Vercel builds main
# (so a merge to main IS the prod deploy; this is the check that should be green
# before that merge).
on:
  pull_request:
  push:
    branches: [dev, staging, main]

permissions:
  contents: read

# A newer commit on the same PR/branch supersedes the running check.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      # Same toolchain as deploy-staging.yml: pnpm 11 (pnpm-workspace.yaml uses
      # pnpm 10+ settings), node 22, no `cache: pnpm`.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22

      # Identical to deploy-staging.yml: the committed lockfile is the source of
      # truth for a --frozen-lockfile install, and the dev-time supply-chain
      # guards re-flag an already-locked entry on a fresh runner. Stripped for
      # this ephemeral checkout only; allowBuilds is kept.
      - name: Relax dev-only supply-chain guards for CI frozen install
        run: sed -i '/^minimumReleaseAge:/d; /^trustPolicy:/d' pnpm-workspace.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # `tsc -b && vite build` — this is also the type check (there is no
      # separate typecheck script). No VITE_* vars are needed: every
      # import.meta.env read has a fallback, and the Sentry source-map upload
      # only runs when SENTRY_AUTH_TOKEN is set, which it never is here.
      - run: pnpm build
      - run: pnpm test
