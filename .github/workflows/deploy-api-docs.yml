name: deploy-api-docs

# Build the API docs site (api-docs/) from the services' own code, then deploy
# its one Worker. api-docs/ is its own package; nothing here touches the portal.
# No spec storage: this job checks out backend + call-service at their staging
# branch and runs their scripts/export_openapi.py (app.openapi() needs no
# database or secrets). Triggered by the services' `docs-dispatch` workflow,
# by pushes to staging here that touch api-docs/, or by hand.
#
# The docs site is backed by STAGING only:
#   tier=staging -> services@staging (staging servers) -> omaya-api-docs (docs.omayacare.com)
#   tier=main    -> skipped (kept so the services' main-push dispatch doesn't error)
#
# Repo config (Settings -> Secrets and variables -> Actions):
#   secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit), CLOUDFLARE_ACCOUNT_ID,
#            DOCS_SOURCE_TOKEN (fine-grained PAT: Contents read on bloom-backend + omaya-call-service)
on:
  push:
    branches: [staging]
    paths: ["api-docs/**", ".github/workflows/deploy-api-docs.yml"]
  workflow_dispatch:
    inputs:
      tier:
        description: Which tier triggered this (only staging builds; main is a no-op)
        type: choice
        options: [main, staging]
        required: true

# One deploy per tier at a time; never cancel one mid-flight.
concurrency:
  group: deploy-api-docs-${{ inputs.tier || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-deploy:
    if: ${{ (inputs.tier || github.ref_name) == 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TIER: ${{ inputs.tier || github.ref_name }}
      OMAYA_ENV: dev
    defaults:
      run:
        working-directory: api-docs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Check out backend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: Omaya-Care/bloom-backend
          ref: ${{ env.TIER }}
          token: ${{ secrets.DOCS_SOURCE_TOKEN }}
          path: api-docs/_src/backend
      - name: Check out call-service
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: Omaya-Care/omaya-call-service
          ref: ${{ env.TIER }}
          token: ${{ secrets.DOCS_SOURCE_TOKEN }}
          path: api-docs/_src/call-service

      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc  # v6.4.3
        with:
          enable-cache: true
          cache-dependency-glob: api-docs/_src/*/uv.lock

      - name: Export specs
        run: |
          case "$TIER" in
            staging) servers=staging ;;
            *) echo "unsupported tier $TIER"; exit 1 ;;
          esac
          for svc in backend call-service; do
            (cd "_src/$svc" && uv sync --frozen -q && uv run python scripts/export_openapi.py --out-dir "$GITHUB_WORKSPACE/api-docs/specs" --tier "$servers")
          done

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler deploy --message "${GITHUB_SHA::7}"
