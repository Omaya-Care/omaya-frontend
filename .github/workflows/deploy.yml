name: deploy

# Build the docs from the specs the services publish to R2, then deploy the
# tier's Worker. Triggered by the backend / call-service `publish-openapi`
# workflows (workflow_dispatch with the tier), by pushes here, or by hand.
#
#   tier=main    -> specs from r2://omaya-api-docs-specs/main/    -> omaya-api-docs         (docs.omayacare.com)
#   tier=staging -> specs from r2://omaya-api-docs-specs/staging/ -> omaya-api-docs-staging (docs-staging.omayacare.com)
#
# Repo config (Settings -> Secrets and variables -> Actions):
#   secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit + R2: Read), CLOUDFLARE_ACCOUNT_ID
on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      tier:
        description: Which tier's specs to build and deploy
        type: choice
        options: [main, staging]
        required: true

# One deploy per tier at a time; never cancel one mid-flight.
concurrency:
  group: deploy-${{ inputs.tier || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TIER: ${{ inputs.tier || github.ref_name }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile

      - name: Pull specs for this tier
        run: |
          for f in backend ops call-service; do
            pnpm exec wrangler r2 object get "omaya-api-docs-specs/$TIER/$f.json" --remote --file "specs/$f.json"
          done

      - run: pnpm build

      - name: Deploy Worker
        run: |
          if [ "$TIER" = main ]; then
            pnpm exec wrangler deploy --message "${GITHUB_SHA::7}"
          else
            pnpm exec wrangler deploy --env "$TIER" --message "${GITHUB_SHA::7}"
          fi
